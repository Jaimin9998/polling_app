<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Polls · Presenting</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="layout" class="host-layout">
    <aside id="join-panel" class="join-panel">
      <picture><source srcset="/brand/logo-small.webp" type="image/webp"><img class="brand-logo" src="/brand/logo-small.png" width="360" height="258" alt="Prasangam Vedic Events: Where Traditions Meet Elegance"></picture>
      <p class="label">Join at</p>
      <p id="join-url" class="join-url"></p>
      <p class="label">with code</p>
      <p id="code" class="code"></p>
      <button id="qr-open" type="button" class="qr-button" aria-label="Show the QR code full screen">
        <img id="qr" alt="QR code to join the poll" width="180" height="180">
      </button>
      <p class="qr-hint">Click the QR code to enlarge it</p>
      <p id="audience" class="audience"></p>
      <button id="panel-hide" type="button" class="link">Hide join panel</button>
    </aside>

    <section class="stage">
      <header id="topbar" class="host-topbar" hidden>
        <picture><source srcset="/brand/logo-small.webp" type="image/webp"><img class="brand-logo" src="/brand/logo-small.png" width="360" height="258" alt="Prasangam Vedic Events: Where Traditions Meet Elegance"></picture>
        <div class="topbar-side">
          <span id="audience-top" class="audience"></span>
          <button id="qr-open-top" type="button" class="secondary">Full-screen QR</button>
          <button id="panel-show" type="button" class="secondary">Show join panel</button>
        </div>
      </header>
      <p id="progress" class="label"></p>
      <h1 id="prompt"></h1>
      <p class="edit-link"><button id="edit-question" type="button" class="link">Edit question</button></p>
      <form id="edit-form" class="edit-form" hidden>
        <label class="field-label" for="edit-prompt">Question</label>
        <input id="edit-prompt" maxlength="140" autocomplete="off" required>
        <div id="edit-options"></div>
        <div class="row">
          <button id="edit-save" type="submit">Save</button>
          <button id="edit-cancel" type="button" class="secondary">Cancel</button>
        </div>
        <p id="edit-error" class="error" role="alert" hidden></p>
      </form>
      <p id="total" class="total"></p>
      <div id="results" class="results" aria-live="polite"></div>
      <div class="controls">
        <button id="prev" type="button" class="secondary">← Previous</button>
        <button id="lock" type="button" class="secondary">Lock voting</button>
        <button id="next" type="button">Next →</button>
        <button id="close-event" type="button" class="danger" hidden>Close event</button>
        <button id="download-results" type="button" class="secondary">Download results</button>
      </div>
      <p id="download-msg" class="ok" role="status" hidden></p>
      <p id="closed-note" class="closed-note" role="status" hidden>The event is closed. Every phone now shows the thank-you screen. <a href="/organise">Start another event</a></p>
    </section>
  </main>

  <div id="qr-full" class="qr-full" role="dialog" aria-modal="true" aria-label="Scan to join" hidden>
    <img id="qr-big" class="qr-big" alt="Large QR code to join the poll">
    <div class="qr-full-side">
      <picture><source srcset="/brand/logo-small.webp" type="image/webp"><img class="brand-logo qr-full-logo" src="/brand/logo-small.png" width="360" height="258" alt=""></picture>
      <p class="label">Scan to join</p>
      <p id="qr-full-code" class="code"></p>
      <p id="qr-full-url" class="join-url"></p>
      <button id="qr-close" type="button" class="secondary">Close (Esc)</button>
    </div>
  </div>

  <p id="status" class="status" role="status" hidden></p>
  <div id="fatal" class="fatal" role="alert" hidden>
    <p id="fatal-msg"></p>
    <a href="/">Back to home</a>
  </div>
  <script src="/vendor/confetti.js"></script>
  <script type="module" src="/host.js"></script>
</body>
</html>
