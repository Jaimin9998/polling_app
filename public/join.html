<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Polls · Join</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="audience-page">
  <main class="page">
    <div id="live-ui">
      <img class="brand-logo" src="/brand/logo-small.png" width="360" height="258" alt="Prasangam Vedic Events: Where Traditions Meet Elegance">
      <h1 id="prompt">Connecting…</h1>
      <div id="answer"></div>
      <p id="note" class="note" aria-live="polite"></p>
    </div>

    <section id="thanks" class="thanks" hidden>
      <img class="brand-logo" src="/brand/logo.png" width="1000" height="716" alt="Prasangam Vedic Events: Where Traditions Meet Elegance">
      <h1>Thank you for joining!</h1>
      <p>The event has now ended. We hope you enjoyed it.</p>
    </section>
  </main>

  <p id="status" class="status" role="status" hidden></p>
  <div id="fatal" class="fatal" role="alert" hidden>
    <p id="fatal-msg"></p>
    <a href="/">Back to home</a>
  </div>
  <script type="module" src="/join.js"></script>
</body>
</html>
