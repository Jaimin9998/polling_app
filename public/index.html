<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Polls</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <img class="brand-logo" src="/brand/logo.png" width="1000" height="716" alt="Prasangam Vedic Events: Where Traditions Meet Elegance">
      <h1 class="visually-hidden">Live Polls</h1>
      <p>Ask a question. Watch the answers arrive.</p>
    </header>

    <section class="card" aria-labelledby="join-h">
      <h2 id="join-h">Join a poll</h2>
      <form id="join-form" class="row">
        <input id="join-code" name="code" placeholder="CODE" maxlength="5" autocomplete="off" autocapitalize="characters" aria-label="Join code" required>
        <button type="submit">Join</button>
      </form>
      <p id="join-error" class="error" role="alert" hidden></p>
    </section>

    <section class="card" aria-labelledby="create-h">
      <h2 id="create-h">Create a poll</h2>
      <label class="field-label" for="event-name">Event name (used when saving)</label>
      <input id="event-name" placeholder="e.g. Diwali evening" maxlength="60" autocomplete="off">
      <div id="slides"></div>
      <div class="row">
        <button type="button" id="add-choice" class="secondary">+ Multiple choice</button>
        <button type="button" id="add-cloud" class="secondary">+ Word cloud</button>
      </div>
      <p id="create-error" class="error" role="alert" hidden></p>
      <button type="button" id="start">Start presenting</button>
    </section>

    <section class="card" aria-labelledby="saved-h">
      <h2 id="saved-h">Save and load</h2>
      <p class="hint">Your work is autosaved in this browser. Save a named draft here, or download a file to keep it or open it on another device.</p>
      <div class="row">
        <button type="button" id="save-draft" class="secondary">Save draft</button>
        <button type="button" id="download-event" class="secondary">Download event file</button>
        <button type="button" id="load-event-btn" class="secondary">Load event file</button>
        <input type="file" id="load-event" accept=".json,application/json" hidden>
      </div>
      <p id="saved-msg" class="ok" role="status" hidden></p>
      <p id="saved-error" class="error" role="alert" hidden></p>
      <h3 class="drafts-title">Saved drafts</h3>
      <ul id="drafts" class="drafts"></ul>
      <button type="button" id="new-poll" class="link">Start a blank poll</button>
    </section>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
